[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.9"
name = "home_credit_risk"
readme = "README.md"
dynamic = [ "version",]
dependencies = [ 
  "ipython>=8.10", 
  "jupyterlab>=3.0", 
  "notebook", 
  "kedro~=1.0.0",
  "pandas>=1.5.0",
  "numpy>=1.21.0",
  "scikit-learn>=1.1.0",
  "xgboost>=1.6.0",
  "lightgbm>=3.3.0",
  "matplotlib>=3.5.0",
  "seaborn>=0.11.0",
  "plotly>=5.0.0"
]

[project.scripts]
home-credit-risk = "home_credit_risk.__main__:main"

[project.optional-dependencies]
dev = [ "pytest-cov~=3.0", "pytest-mock>=1.7.1, <2.0", "pytest~=7.2", "ruff~=0.12.0",]

[tool.kedro]
package_name = "home_credit_risk"
project_name = "Home Credit Default Risk"
kedro_init_version = "1.0.0"
tools = "['Testing', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/home_credit_risk -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [ "pragma: no cover", "raise NotImplementedError",]

[tool.setuptools.dynamic.version]
attr = "home_credit_risk.__version__"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false

[tool.kedro_telemetry]
project_id = "089e873bdcd84ba8a8dbf24cfc030662"
